[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asmodeus-starter"
version = "0.1.0"
description = "Polyglot hexagonal project scaffolder with composable overlays and Study/Build modes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.100",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.100",
]

[project.scripts]
asmodeus = "asmodeus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asmodeus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["asmodeus"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
